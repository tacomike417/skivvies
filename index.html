<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff6f0">
<title>Skivvies — Because rock bottom shouldn't be bare bottom.</title>
<meta name="description" content="New underwear and socks for men and women on day one of recovery in Stark County, Ohio.">
<link rel="icon" href="img/profile.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skivvies">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#102520;--coral:#f35d40;--cream:#fff6f0;--muted:#52635c}
*{box-sizing:border-box}
body{margin:0;background:#f2f3f0;color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1665a3;outline-offset:3px}
.shell{max-width:390px;margin:0 auto;min-height:100dvh;background:var(--cream);box-shadow:0 5px 32px #00000012;position:relative}
@media(min-width:700px){body{padding:35px 0}.shell{border-radius:30px;overflow:hidden;min-height:760px}}

/* header */
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;gap:10px}
.brand{border:0;background:none;text-align:left;padding:0;font-size:30px;font-weight:900;letter-spacing:-.05em;color:var(--ink);line-height:1}
.headright{display:flex;align-items:center;gap:8px}
.pill{background:#fff;border:1px solid #d9dedb;color:#111;border-radius:30px;padding:6px 12px;font-weight:800;font-size:12px}
.menu{border:0;background:transparent;font-size:26px;color:var(--ink);padding:2px 5px;line-height:1}
.nav{display:none;padding:8px 18px 18px;border-bottom:1px solid #efd9cf}
.nav.open{display:grid;gap:6px}
.nav button{border:0;background:#fff;text-align:left;padding:12px 14px;border-radius:12px;font-weight:700;color:var(--ink)}

/* hero */
.hero{padding:8px 20px 28px;text-align:center}
.pair{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:0 0 6px}
.pair img{width:46%;height:auto}
.tag1{font-weight:900;font-size:42px;line-height:1;letter-spacing:-.045em;margin:0 0 12px;color:var(--ink)}
.tag1 span{color:var(--coral)}
.tag2{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:22px;color:var(--coral);margin:0 0 22px}
.cta{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:16px 18px;border-radius:16px;margin:10px 0;background:var(--coral);color:#fff;border:2px solid var(--coral)}
.cta.light{background:#fff;color:var(--ink);border-color:var(--ink)}
.cta .copy{flex:1}.cta strong{display:block;font-size:19px;letter-spacing:-.02em}.cta small{display:block;font-size:12.5px;line-height:1.35;margin-top:3px;opacity:.95}
.cta .right{font-size:24px}
.scrollhint{font-size:13px;color:var(--muted);margin:14px 0 0}

/* strip + slogan */
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{flex:0 0 260px;width:260px;height:260px;border-radius:18px;scroll-snap-align:center;box-shadow:0 6px 20px #10252014;background:#fff}
.slogan{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:22px 20px;text-align:center;margin-top:6px}
.slogan .q{transition:opacity .12s;font-weight:900;font-size:26px;line-height:1.08;letter-spacing:-.035em;min-height:3.3em;display:flex;align-items:center;justify-content:center}
.slogan button{margin-top:14px;border:0;background:var(--coral);color:#fff;border-radius:12px;padding:13px 18px;font-weight:850;font-size:15px}
/* sections */
.section{padding:30px 22px}
.section.coral{background:var(--coral);color:#fff}
.section.ink{background:var(--ink);color:var(--cream)}
h2{font-size:30px;line-height:1.05;letter-spacing:-.04em;margin:0 0 14px;font-weight:900}
p{line-height:1.5;margin:0 0 12px;font-size:16px}
.big{font-size:19px;font-weight:700}
.punch{display:grid;gap:12px;margin-top:6px}
.punch div{background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px}
.punch strong{display:block;font-size:17px;margin-bottom:4px}
.punch p{font-size:14px;margin:0;color:var(--muted)}
.section.coral .punch div{background:#fff8f3}
.duo{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:0 0 10px}
.duo img{width:40%}
.linkbutton{border:0;background:transparent;color:#d94b32;text-decoration:underline;text-underline-offset:4px;font-weight:800;display:inline-block;margin:6px 0 0;padding:6px 0}
.section.ink .linkbutton{color:#ffb3a3}
.social{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.social a{display:block;text-align:center;padding:14px;border-radius:14px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800;border:2px solid var(--ink)}
.footer{padding:18px 20px 26px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#68736d;font-size:12px}
.footer a{color:inherit;border:1px solid #d9dedb;border-radius:25px;padding:8px 12px;text-decoration:none;font-weight:700}

/* share + install */
.qr{display:block;width:240px;height:240px;margin:10px auto 6px;border-radius:16px}
.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.steps li{background:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.steps b{background:var(--coral);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;flex:0 0 28px;font-size:14px}
/* inner pages */
.page{padding:22px 20px 36px}
.page h1{font-size:38px;line-height:1.02;letter-spacing:-.045em;margin:0 0 12px;font-weight:900}
.page h1 span{color:var(--coral)}
.card{border:1px solid #e6d9d0;background:#fff;border-radius:17px;padding:17px;margin:14px 0}
.card.selected{border:2px solid var(--coral);background:#fff9f5}
.card h3{margin:0 0 7px;font-size:21px}.card p{font-size:14px;margin:7px 0}
.price{font-size:25px;font-weight:900;color:#e95335}
.options{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}
.option{padding:11px 15px;border:1px solid #cdd7d0;border-radius:10px;background:#fff;font-weight:750;color:var(--ink)}
.option.active{background:var(--ink);color:#fff;border-color:var(--ink)}
label.field{display:block;font-weight:750;font-size:13px;margin:14px 0 5px}
input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #bdcbc2;border-radius:11px;padding:13px;background:#fff;color:var(--ink)}
textarea{min-height:90px}
.toggle{display:flex;align-items:center;gap:10px;margin:17px 0;font-weight:750}.toggle input{width:20px;height:20px;accent-color:var(--coral)}
.total{font-size:26px;font-weight:950;margin:15px 0}
.action{width:100%;border:0;border-radius:13px;background:var(--coral);color:#fff;padding:16px;font-weight:850;font-size:16px}
.action:disabled{background:#c1c9c3;color:#3c5146;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted)}
.success{text-align:center;padding:42px 0}.success .check{font-size:55px;color:#33865c}
.actions{display:grid;gap:9px}
.outline{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:13px;padding:13px;font-weight:800;width:100%}
.nowrap{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14px;max-width:340px;width:calc(100% - 40px);text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="shell">
<header class="header">
  <button class="brand" data-go="home" aria-label="Skivvies home">skivvies</button>
  <div class="headright"><span class="pill">v0.5</span><button class="menu" id="menu" aria-label="Open menu" aria-expanded="false">☰</button></div>
</header>
<nav class="nav" id="nav" aria-label="Main navigation">
  <button data-go="home">Home</button>
  <button data-go="kit">Cover Someone's Butt</button>
  <button data-go="drive">Host an Undie Sunday</button>
  <button data-go="about">About</button>
  <button data-go="share">Share Skivvies</button>
  <button id="installbtn" data-go="install">Install the app</button>
</nav>
<main id="app"></main>
<footer class="footer"><span><button class="linkbutton" style="margin:0;padding:0;font-size:12px" data-go="share">Share</button> · hello@skivvies.org</span><a href="https://apps.thunkbox.com" target="_blank" rel="noopener">Apps by ThunkBox ↗</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
let toastTimer;function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function copyText(x){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(x);return new Promise((ok,no)=>{const a=document.createElement('textarea');a.value=x;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const done=document.execCommand('copy');a.remove();done?ok():no()})}
const STRIP=["03", "04", "05", "06", "07", "09", "12", "13", "14", "16", "01", "02"];
const SLOGANS=["Because rock bottom shouldn't be bare bottom.", "One pair at a time.", "New underwear and socks for people starting recovery. Stark County, Ohio.", "Help us briefly change lives.", "No ifs, ands, or bare butts.", "Nobody donates underwear. We do.", "Everybody deserves a fresh start. Especially their underwear.", "New life. New undies. No exceptions.", "Day one. Clean socks. It matters more than you'd think.", "Save a pair. Change a life.", "Give a pair. Show you care.", "Skivvies: that's the whole program. New underwear for people on day one of recovery.", "We've got recovery covered. Now let's cover their butts.", "Don't leave recovery hanging.", "Rock bottom is a place. Bare bottom is a choice. Ours.", "Shelters can't take used underwear. Think about that for a second.", "Fresh pair. Fresh start. Same day.", "Yes, we're a charity about underwear. No, we won't stop making the jokes.", "Step one: admit you need new drawers.", "Most people arrive with the clothes on their back. Sometimes not even all of those.", "Support comes in many forms. Ours has an elastic waistband.", "Boxers or briefs? Yes.", "The peach is a metaphor. The underwear is not.", "New. Tags on. Yours.", "Sobriety is hard. Underwear shouldn't be.", "Cheeky by name. Serious by nature.", "Socks are the most requested item at every shelter in America. Still true in Stark County.", "Keep coming back. Keep your pants on.", "Clean living starts with clean underwear.", "This is what dignity looks like at 6 a.m. on your first morning.", "One day at a time. One pair at a time.", "If you've been to the bottom, you know. If you haven't, we'll keep it brief.", "Underwear is the most needed and least donated piece of clothing. We're fixing the second half.", "Rock bottom has a dress code now.", "Not all heroes wear capes. Some just wear new underwear for the first time in months.", "Men and women. Stark County. Day one. That's who this is for.", "We can't fix everything. We can fix this.", "Thong story short: people starting over deserve the basics.", "Because rock bottom shouldn't be bare bottom.", "Skivvies. New basics for people starting recovery. Follow along.", "Bottoms up! Wait, wrong meeting.", "Higher power, lower coverage.", "Keep coming back. We've got your backside.", "Rock bottom is rough enough without going commando.", "The only thing we're enabling is better underwear.", "Brief encounters. Lasting recovery.", "Surrender your old ways. And those old boxers.", "Good things come to those who change their panties.", "Your sponsor can't fix everything. We can fix your drawers.", "Step one: get your briefs together.", "Less baggage. More cheekage.", "One day at a time. Two cheeks at a time.", "We believe in second chances and fresh underpants.", "Rock bottom looks better with fresh panties."];
let sloganIdx=0;let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(page()==='install')render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;toast('Skivvies is on your phone.');if(page()==='install')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const app=document.querySelector('#app'),nav=document.querySelector('#nav'),menu=document.querySelector('#menu');
let state={kit:'men',qty:1,monthly:false,thanks:false};
const bulletin='Join our Undie Sunday for Skivvies! Bring NEW underwear and socks to help men and women starting recovery in Stark County, Ohio. Because rock bottom shouldn\'t be bare bottom. skivvies.org';

function home(){return `
<section class="hero">
  <div class="pair"><img src="img/thong.png" alt="A thong with a sunrise behind it"><img src="img/boxers.png" alt="Boxer briefs with a sunrise behind it"></div>
  <h1 class="tag1">Because rock bottom <span>shouldn't be bare bottom.</span></h1>
  <p class="tag2">One pair at a time.</p>
  <button class="cta" data-go="kit"><span class="copy"><strong>Cover Someone's Butt</strong><small>$15 covers new underwear and socks for somebody's first day.</small></span><span class="right">→</span></button>
  <p class="scrollhint">Wait, what is this? ↓</p>
</section>

<section class="section">
  <h2>So what is this?</h2>
  <p class="big">We hand new underwear and socks to men and women on day one of recovery in Stark County, Ohio.</p>
  <p>That's it. That's the whole thing. People show up to treatment with a bag, or no bag, and almost never with clean drawers. We fix that part.</p>
</section>

<section class="section" style="padding-left:0;padding-right:0">
  <h2 style="padding:0 22px">Fresh off the feed.</h2>
  <div class="strip">${STRIP.map(n=>`<img src="posts/web/${n}.jpg" alt="Skivvies post" loading="lazy">`).join('')}</div>
</section>

<section class="section coral">
  <h2>Why underwear, of all things?</h2>
  <div class="punch">
    <div><strong>Nobody donates it.</strong><p>Coats, yes. Shoes, sure. Underwear is the least donated piece of clothing there is.</p></div>
    <div><strong>Shelters can't take it used.</strong><p>For obvious reasons. It has to be new, so somebody has to buy it.</p></div>
    <div><strong>Day one is rough enough.</strong><p>A fresh pair won't fix your life. It's a decent way to start the morning, though.</p></div>
  </div>
</section>

<section class="section">
  <div class="duo"><img src="img/panties-socks.png" alt=""><img src="img/boxers-socks.png" alt=""></div>
  <h2>Got a church? A shop? A team?</h2>
  <p>Pick a Sunday. Put out a box. Collect new underwear and socks. We'll come grab it. We call it an Undie Sunday, and yes, you can say that from the pulpit.</p>
  <button class="cta light" data-go="drive"><span class="copy"><strong>Host an Undie Sunday</strong><small>Takes two minutes to sign up.</small></span><span class="right">→</span></button>
</section>

<section class="section">
  <h2>We have a lot of these.</h2>
  <div class="slogan"><div class="q" id="slogan">${SLOGANS[0]}</div><button id="nextslogan">Hit me with another one</button></div>
</section>

<section class="section ink">
  <h2>Follow along.</h2>
  <p>New posts most days. Some of them are even about underwear.</p>
  <div class="social">
    <a href="https://www.instagram.com/skivviesproject" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.facebook.com/skivvies.org" target="_blank" rel="noopener">Facebook</a>
  </div>
  <button class="linkbutton" data-go="about">Who's behind this? →</button>
</section>`}

function kit(){let isMen=state.kit==='men',total=isMen?15*state.qty:null;return `<section class="page">
<h1>Cover <span>Someone's Butt.</span></h1>
<p>Fifteen bucks covers new underwear and socks for somebody's first day. If there's anything left over, it goes to a tee and the basics.</p>
<div class="card ${isMen?'selected':''}" role="button" tabindex="0" data-kit="men"><h3>For a guy <span class="price">$15</span></h3><p>3 pairs boxer briefs · 3 pairs socks · and whatever else $15 stretches to</p></div>
<div class="card ${!isMen?'selected':''}" role="button" tabindex="0" data-kit="women"><h3>For a woman <span class="price">$__</span></h3><p>Underwear · socks · and we're working out the rest</p><p class="hint">Pricing this one out now.</p></div>
<h3>How many?</h3>
<div class="options">${[1,5,10].map(n=>`<button class="option ${state.qty===n?'active':''}" data-qty="${n}">${n}</button>`).join('')}<button class="option ${![1,5,10].includes(state.qty)?'active':''}" data-customqty="1">Custom</button></div>
${![1,5,10].includes(state.qty)?`<label class="field" for="qty">How many</label><input id="qty" type="number" min="1" max="10000" value="${state.qty}">`:''}
<label class="toggle"><input id="monthly" type="checkbox" ${state.monthly?'checked':''}> Make it monthly</label>
<div class="total">${total===null?'Price coming':'$'+total+(state.monthly?' / month':'')}</div>
<button class="action" data-checkout="kit" ${total===null?'disabled':''}>${total===null?"Women's coming soon":'Giving opens soon'}</button>
<p class="hint">We're not taking money yet. Follow along and we'll say when.</p>
</section>`}

function drive(){if(state.thanks)return `<section class="page"><div class="success"><div class="check">✓</div><h1>You're in.</h1><p>Thanks for covering some butts. We'll be in touch about pickup.</p><p class="hint">Heads up: this form isn't wired yet, so nothing was sent. Email hello@skivvies.org for now.</p></div><div class="actions"><button class="outline" id="flyer">Download a flyer (coming soon)</button><button class="outline" id="copy">Copy the bulletin blurb</button><button class="action" data-go="home">Back home</button></div></section>`;
return `<section class="page"><h1>Host an <span>Undie Sunday.</span></h1>
<p>Pick a Sunday. Collect <strong>new</strong> underwear and socks at your church, shop, school or team. We'll come get them.</p>
<form id="driveform">
<label class="field" for="org">Church / business / group</label><input id="org" name="organization" required maxlength="120">
<label class="field" for="contact">Your name</label><input id="contact" name="contact" required maxlength="120">
<label class="field" for="phone">Phone</label><input id="phone" name="phone" type="tel" required>
<label class="field" for="email">Email</label><input id="email" name="email" type="email" required>
<label class="field" for="date">Which Sunday?</label><input id="date" name="date" type="date" required>
<label class="field" for="audience">Collecting for</label><select id="audience" name="audience"><option>Both</option><option>Men</option><option>Women</option></select>
<label class="field" for="people">Rough headcount</label><input id="people" name="people" type="number" min="1" placeholder="How many folks?" required>
<label class="field" for="notes">Anything else</label><textarea id="notes" name="notes" maxlength="2000" placeholder="Parking, side door, who to ask for..."></textarea>
<p class="hint">Form isn't wired up yet. Nothing gets sent. Email hello@skivvies.org and a human will answer.</p>
<button class="action" type="submit">Sign us up →</button>
</form></section>`}

function about(){return `<section class="page"><h1>Who's <span>behind this?</span></h1>
<p>People in recovery, mostly. We work in treatment, we've sat in those chairs, and we got tired of watching folks start over with nothing in the drawer.</p>
<p>Skivvies gives new underwear, socks and basics to men and women entering local treatment programs in Stark County, Ohio. New only. No exceptions.</p>
<div class="card"><h3>Say hi</h3><p><strong>hello@skivvies.org</strong></p><p>Instagram @skivviesproject · facebook.com/skivvies.org</p></div>
<button class="action" data-go="kit">Cover Someone's Butt →</button>
<button class="linkbutton" data-go="drive">Host an Undie Sunday →</button>
</section>`}

function share(){return `<section class="page"><h1>Spread the <span>word.</span></h1>
<p>Text it, post it, stick it on the church bulletin board. The QR goes straight to skivvies.org.</p>
<img class="qr" src="img/qr.png" alt="QR code for skivvies.org">
<div class="actions">
<button class="action" id="sharebtn">Share skivvies.org</button>
<button class="outline" id="copylink">Copy the link</button>
<a class="outline" style="text-align:center;text-decoration:none;display:block" href="img/qr.png" download="skivvies-qr.png">Download the QR code</a>
</div>
<p class="hint" style="margin-top:14px">Posting about us? Tag @skivviesproject on Instagram or Skivvies.org on Facebook.</p>
</section>`}
function install(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone)return `<section class="page"><h1>Already <span>installed.</span></h1><p>You're running the app right now. Nice.</p><button class="action" data-go="home">Back home</button></section>`;
return `<section class="page"><h1>Put it on your <span>phone.</span></h1>
<p>Skivvies installs as a web based app. No app store, nothing to update, takes up about as much room as a text message.</p>
${deferredPrompt?`<button class="action" id="doinstall">Install Skivvies</button>`:ios?`<ol class="steps">
<li><b>1</b><span>Tap the <strong>Share</strong> button at the bottom of Safari (the square with the arrow).</span></li>
<li><b>2</b><span>Scroll down and tap <strong>Add to Home Screen</strong>.</span></li>
<li><b>3</b><span>Tap <strong>Add</strong>. Skivvies shows up next to your other apps.</span></li></ol>`:`<ol class="steps">
<li><b>1</b><span>Tap the <strong>⋮</strong> menu in the top right of Chrome.</span></li>
<li><b>2</b><span>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>.</span></li>
<li><b>3</b><span>Tap <strong>Install</strong>. Done.</span></li></ol>`}
</section>`}
function page(){return (history.state&&history.state.page)||location.hash.slice(1)||'home'}
function render(){let p=page();app.innerHTML=({home,kit,drive,about,share,install}[p]||home)();nav.classList.remove('open');menu.setAttribute('aria-expanded','false');window.scrollTo(0,0)}
function go(p){history.pushState({page:p},'',p==='home'?location.pathname:'#'+p);render()}
history.replaceState({page:location.hash.slice(1)||'home'},'');
window.addEventListener('popstate',render);
menu.onclick=()=>{let open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))};
document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){go(b.dataset.go);return}
b=e.target.closest('[data-kit]');if(b){state.kit=b.dataset.kit;render();return}
b=e.target.closest('[data-qty]');if(b){state.qty=+b.dataset.qty;render();return}
b=e.target.closest('[data-customqty]');if(b){state.qty=2;render();return}
b=e.target.closest('[data-checkout]');if(b){toast('Giving opens soon. Nothing was charged.');return}
if(e.target.id==='nextslogan'){sloganIdx=(sloganIdx+1+Math.floor(Math.random()*(SLOGANS.length-1)))%SLOGANS.length;const q=document.querySelector('#slogan');q.style.opacity=0;setTimeout(()=>{q.textContent=SLOGANS[sloganIdx];q.style.opacity=1},120);return}
if(e.target.id==='doinstall'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()});return}
if(e.target.id==='sharebtn'){const d={title:'Skivvies',text:"Because rock bottom shouldn't be bare bottom. New underwear and socks for people starting recovery.",url:'https://skivvies.org'};if(navigator.share){navigator.share(d).catch(()=>{})}else{copyText(d.url).then(()=>toast('Link copied. Paste it anywhere.'))}return}
if(e.target.id==='copylink'){copyText('https://skivvies.org').then(()=>toast('Link copied.')).catch(()=>toast('Could not copy.'));return}
if(e.target.id==='flyer'){toast('Flyer is coming soon.');return}
if(e.target.id==='copy'){copyText(bulletin).then(()=>toast('Bulletin blurb copied.')).catch(()=>toast('Could not copy. Press and hold to copy it instead.'));return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-kit]')){e.preventDefault();state.kit=e.target.dataset.kit;render()}});
document.addEventListener('change',e=>{if(e.target.id==='monthly')state.monthly=e.target.checked;if(e.target.id==='qty'){state.qty=Math.max(1,Math.min(10000,parseInt(e.target.value,10)||1));render()}});
document.addEventListener('submit',e=>{if(e.target.id==='driveform'){e.preventDefault();state.thanks=true;go('drive')}});
render();
</script>
</body>
</html>
