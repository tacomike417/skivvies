<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6f0"><title>Skivvies Project — New basics for people starting recovery</title><style>
:root{--ink:#102520;--orange:#f35d40;--cream:#fff6f0;--muted:#52635c}*{box-sizing:border-box}body{margin:0;background:#f2f3f0;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #1665a3;outline-offset:3px}.shell{max-width:390px;margin:0 auto;min-height:100dvh;background:#fff;box-shadow:0 5px 32px #00000012}.header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 15px;gap:10px}.brand{border:0;background:none;text-align:left;padding:0;font-size:29px;font-weight:950;letter-spacing:-1.8px;color:var(--ink);line-height:.85}.brand small{display:block;text-align:center;letter-spacing:5px;font-size:9px;margin-top:8px}.heart{color:var(--orange)}.headright{display:flex;align-items:center;gap:8px}.pill{background:#fff;border:1px solid #d9dedb;color:#111;border-radius:30px;padding:6px 12px;font-weight:800;font-size:12px}.menu{border:0;background:transparent;font-size:25px;color:var(--ink);padding:2px 5px}.nav{display:none;padding:8px 18px 18px;border-bottom:1px solid #eee}.nav.open{display:grid;gap:6px}.nav button{border:0;background:var(--cream);text-align:left;padding:12px;border-radius:10px;font-weight:700;color:var(--ink)}.hero{padding:24px 21px 30px;background:var(--cream)}h1{font-size:39px;line-height:1.06;letter-spacing:-1.8px;margin:0 0 15px;font-weight:950}h1 span{color:var(--orange)}h2{font-size:26px;line-height:1.15;letter-spacing:-.8px;margin:0 0 14px}p{line-height:1.5}.lead{font-size:15px;margin:0 0 20px}.iconart{display:flex;justify-content:center;gap:16px;margin:12px 0 22px}.art{width:83px;height:85px;display:grid;place-items:center;border:2px solid #efcfbe;border-radius:18px;background:#fff;transform:rotate(-7deg)}.art:nth-child(2){background:#f8e8ac;transform:rotate(7deg)}.art:nth-child(3){background:#e4f0e2;transform:rotate(-4deg)}.art svg{width:53px;height:53px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.cta{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:15px 17px;border-radius:15px;margin:10px 0;background:#fff;color:var(--ink);border:2px solid var(--ink)}.cta.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.cta .bigicon{min-width:36px;display:grid;place-items:center}.cta .bigicon svg,.step .symbol svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.step .symbol{color:var(--orange)}.nowrap{white-space:nowrap}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:12px;font-weight:700;font-size:14px;max-width:340px;width:calc(100% - 40px);text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.cta .copy{flex:1}.cta strong{display:block;font-size:18px}.cta small{display:block;font-size:12px;line-height:1.35;margin-top:3px}.cta .right{font-size:23px}.linkbutton{border:0;background:transparent;color:#d94b32;text-decoration:underline;text-underline-offset:4px;font-weight:800;display:block;margin:17px auto 0;padding:6px}.section{padding:27px 21px}.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}.step .symbol{font-size:30px;margin-bottom:6px}.step strong{display:block;font-size:13px}.step p{font-size:11px;margin:6px 0}.trust{background:#f3f7f2;border-radius:15px;padding:17px;margin:10px 19px 22px;font-size:12px;line-height:1.55}.footer{padding:10px 20px 25px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:#68736d;font-size:12px}.footer a{color:inherit;border:1px solid #d9dedb;border-radius:25px;padding:8px 12px;text-decoration:none;font-weight:700}.page{padding:24px 20px 35px}.back{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:750;padding:0 0 22px}.card{border:1px solid #dce3df;border-radius:17px;padding:17px;margin:14px 0}.card.selected{border:2px solid var(--orange);background:#fff9f5}.card h3{margin:0 0 7px;font-size:21px}.card p{font-size:13px;margin:7px 0}.price{font-size:25px;font-weight:900;color:#e95335}.options{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.option{padding:11px 15px;border:1px solid #cdd7d0;border-radius:10px;background:#fff;font-weight:750;color:var(--ink)}.option.active{background:var(--ink);color:#fff;border-color:var(--ink)}label.field{display:block;font-weight:750;font-size:13px;margin:14px 0 5px}input:not([type=checkbox]),select,textarea{width:100%;border:1px solid #bdcbc2;border-radius:11px;padding:13px;background:#fff;color:var(--ink)}textarea{min-height:90px}.toggle{display:flex;align-items:center;gap:10px;margin:17px 0;font-weight:750}.toggle input{width:20px;height:20px;accent-color:var(--orange)}.total{font-size:26px;font-weight:950;margin:15px 0}.action{width:100%;border:0;border-radius:13px;background:var(--orange);color:#fff;padding:16px;font-weight:850;font-size:16px}.action:disabled{background:#c1c9c3;color:#3c5146;cursor:not-allowed}.hint{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.success{text-align:center;padding:42px 0}.success .check{font-size:55px;color:#33865c}.actions{display:grid;gap:9px}.outline{border:2px solid var(--ink);background:white;color:var(--ink);border-radius:13px;padding:13px;font-weight:800;width:100%}@media(min-width:700px){body{padding:35px 0}.shell{border-radius:30px;overflow:hidden;min-height:760px}}
</style></head><body><div class="shell"><header class="header"><button class="brand" data-go="home" aria-label="Skivvies Project home">skivvies<span class="heart">♥</span><small>PROJECT</small></button><div class="headright"><span class="pill">v0.2</span><button class="menu" id="menu" aria-label="Open menu" aria-expanded="false">☰</button></div></header><nav class="nav" id="nav" aria-label="Main navigation"><button data-go="home">Home</button><button data-go="kit">Sponsor a Kit</button><button data-go="give">Give Any Amount</button><button data-go="drive">Host an Undie Sunday</button><button data-go="about">About</button></nav><main id="app"></main><footer class="footer"><span>skivvies.org</span><a href="https://apps.thunkbox.com" target="_blank" rel="noopener">Apps by ThunkBox ↗</a></footer></div><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
let toastTimer;function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}function copyText(x){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(x);return new Promise((ok,no)=>{const a=document.createElement('textarea');a.value=x;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const done=document.execCommand('copy');a.remove();done?ok():no()})}const app=document.querySelector('#app'),nav=document.querySelector('#nav'),menu=document.querySelector('#menu');let state={kit:'men',qty:1,monthly:false,amount:15,giveMonthly:false,thanks:false};const bulletin='Join our Undie Sunday drive for Skivvies Project! Bring NEW underwear and socks to help men and women entering addiction treatment in Stark County, Ohio. New basics for people starting recovery.';function icon(kind){let paths={underwear:'<path d="M5 8h54l-6 29-12 13-11-17-11 17L7 37Z"/><path d="M5 17h54"/>',sock:'<path d="M20 5h25v34l11 7q10 10-3 15H22Q7 60 10 48l10-9Z"/><path d="M20 16h25"/>',heart:'<path d="M32 55 10 33C-3 16 18 2 32 19 46 2 67 16 54 33Z"/>',church:'<path d="M32 4v12M27 9h10"/><path d="M14 30 32 16l18 14"/><path d="M18 27v31h28V27"/><path d="M27 58V46a5 5 0 0 1 10 0v12"/><path d="M8 58h48"/>',box:'<path d="M8 20 32 9l24 11v26L32 57 8 46Z"/><path d="M8 20l24 11 24-11M32 31v26"/><path d="M20 14.5l24 11"/>'};return '<svg viewBox="0 0 64 64" aria-hidden="true">'+paths[kind]+'</svg>'}function home(){return `<section class="hero"><h1>New underwear, socks and basics <span>for people starting recovery.</span></h1><p class="lead">We give new essentials to men and women entering addiction treatment in Stark County, Ohio. <strong>You can help today.</strong></p><div class="iconart"><div class="art">${icon('underwear')}</div><div class="art">${icon('sock')}</div><div class="art">${icon('heart')}</div></div><button class="cta primary" data-go="kit"><span class="bigicon">${icon('heart')}</span><span class="copy"><strong>Sponsor a Kit</strong><small>Provide a complete men's kit for $15.</small></span><span class="right">→</span></button><button class="cta" data-go="drive"><span class="bigicon">${icon('church')}</span><span class="copy"><strong>Host an Undie Sunday</strong><small>Collect new underwear and socks at your church, business, school or team.</small></span><span class="right">→</span></button><button class="linkbutton" data-go="give">Give any amount →</button></section><section class="section"><h2>Small things. Big impact.</h2><div class="steps"><div class="step"><div class="symbol">${icon('heart')}</div><strong>You give</strong><p>Money or new underwear and socks.</p></div><div class="step"><div class="symbol">${icon('box')}</div><strong>We pack kits</strong><p>With underwear, socks and essentials.</p></div><div class="step"><div class="symbol">${icon('sock')}</div><strong>Recovery with dignity</strong><p>People get the basics they need.</p></div></div></section><div class="trust"><strong>✓ A program of Cornerstones Recovery Inc, a <span class="nowrap">501(c)(3)</span>.</strong><br>Donations are tax-deductible.</div>`}
function back(){return ''}function kit(){let isMen=state.kit==='men',price=isMen?15:null,total=isMen?15*state.qty:null;return `<section class="page">${back()}<h1>Sponsor a <span>Kit.</span></h1><p>Give someone new essentials as they start recovery.</p><div class="card ${isMen?'selected':''}" role="button" tabindex="0" data-kit="men"><h3>Men's Kit <span class="price">$15</span></h3><p>3 pairs underwear · 3 pairs socks · 1 white tee · 1 hygiene kit</p></div><div class="card ${!isMen?'selected':''}" role="button" tabindex="0" data-kit="women"><h3>Women's Kit <span class="price">$__</span></h3><p>Underwear · socks · bra or sports bra · period products · hygiene kit</p><p class="hint">Price coming soon.</p></div><h3>How many kits?</h3><div class="options">${[1,5,10].map(n=>`<button class="option ${state.qty===n?'active':''}" data-qty="${n}">${n}</button>`).join('')}<button class="option ${![1,5,10].includes(state.qty)?'active':''}" data-customqty="1">Custom</button></div>${![1,5,10].includes(state.qty)?`<label class="field" for="qty">Custom quantity</label><input id="qty" type="number" min="1" max="10000" value="${state.qty}">`:''}<label class="toggle"><input id="monthly" type="checkbox" ${state.monthly?'checked':''}> Give monthly</label><div class="total">Total: ${total===null?'Price pending':'$'+total+(state.monthly?' / month':'')}</div><button class="action" data-checkout="kit" ${total===null?'disabled':''}>${total===null?"Women's kits coming soon":'Continue to checkout →'}</button><p class="hint">Checkout coming soon. No payment is collected here.</p></section>`}
function give(){return `<section class="page">${back()}<h1>Give <span>any amount.</span></h1><p>Every gift helps provide new basics to people starting recovery.</p><div class="options">${[15,30,75,150].map(n=>`<button class="option ${state.amount===n?'active':''}" data-amount="${n}">$${n}</button>`).join('')}<button class="option ${![15,30,75,150].includes(state.amount)?'active':''}" data-customamount="1">Custom</button></div>${![15,30,75,150].includes(state.amount)?`<label class="field" for="amount">Custom amount ($)</label><input id="amount" type="number" min="1" max="100000" value="${state.amount}">`:''}<label class="toggle"><input id="givemonthly" type="checkbox" ${state.giveMonthly?'checked':''}> Give monthly</label><div class="total">Total: $${state.amount}${state.giveMonthly?' / month':''}</div><button class="action" data-checkout="give">Continue to checkout →</button><p class="hint">Checkout coming soon. No payment is collected here.</p></section>`}
function drive(){if(state.thanks)return `<section class="page"><div class="success"><div class="check">✓</div><h1>Thank you!</h1><p>Thanks for helping bring new basics to people starting recovery.</p><p class="hint">Demo only: your form has not been sent. We'll connect submissions before launch.</p></div><div class="actions"><button class="outline" id="flyer">Download your flyer (coming soon)</button><button class="outline" id="copy">Copy bulletin blurb</button><button class="action" data-go="home">Return home</button></div></section>`;return `<section class="page">${back()}<h1>Host an <span>Undie Sunday.</span></h1><p>Pick a Sunday, collect <strong>NEW underwear and socks</strong> at your church, business, school or team, and we'll arrange pickup.</p><form id="driveform"><label class="field" for="org">Organization name</label><input id="org" name="organization" required maxlength="120"><label class="field" for="contact">Contact name</label><input id="contact" name="contact" required maxlength="120"><label class="field" for="phone">Phone</label><input id="phone" name="phone" type="tel" required><label class="field" for="email">Email</label><input id="email" name="email" type="email" required><label class="field" for="date">Preferred date</label><input id="date" name="date" type="date" required><label class="field" for="audience">Collecting for</label><select id="audience" name="audience"><option>Both</option><option>Men</option><option>Women</option></select><label class="field" for="people">Rough number of people participating</label><input id="people" name="people" type="number" min="1" placeholder="Estimate" required><label class="field" for="notes">Notes</label><textarea id="notes" name="notes" maxlength="2000" placeholder="Anything we need to know?"></textarea><p class="hint">This prototype does not transmit or store submissions.</p><button class="action" type="submit">Sign up to host →</button></form></section>`}
function about(){return `<section class="page">${back()}<h1>Why <span>skivvies?</span></h1><p>New underwear is an essential that is often overlooked in clothing donations. Used underwear generally cannot be accepted for redistribution, making new basics especially important.</p><p>Skivvies Project provides new underwear, socks and essentials to men and women entering local treatment programs in Stark County, Ohio.</p><div class="card"><h3>Who runs it?</h3><p>A program of <strong>Cornerstones Recovery Inc</strong>, a <span class="nowrap">501(c)(3)</span> nonprofit.</p><p>Donations are tax-deductible.</p><p><strong>EIN:</strong> [EIN coming soon]</p><p><strong>Contact:</strong> [Public email coming soon]</p></div><button class="action" data-go="kit">Sponsor a Kit →</button><button class="linkbutton" data-go="drive">Host an Undie Sunday →</button></section>`}
function page(){return (history.state&&history.state.page)||'home'}function render(){let p=page();app.innerHTML=({home,kit,give,drive,about}[p]||home)();nav.classList.remove('open');menu.setAttribute('aria-expanded','false');window.scrollTo(0,0)}function go(p){history.pushState({page:p},'',p==='home'?location.pathname:'#'+p);render()}history.replaceState({page:location.hash.slice(1)||'home'},'');window.addEventListener('popstate',render);menu.onclick=()=>{let open=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){go(b.dataset.go);return}b=e.target.closest('[data-kit]');if(b){state.kit=b.dataset.kit;render();return}b=e.target.closest('[data-qty]');if(b){state.qty=+b.dataset.qty;render();return}b=e.target.closest('[data-customqty]');if(b){state.qty=2;render();return}b=e.target.closest('[data-amount]');if(b){state.amount=+b.dataset.amount;render();return}b=e.target.closest('[data-customamount]');if(b){state.amount=20;render();return}b=e.target.closest('[data-checkout]');if(b){toast('Checkout is coming soon. No payment was collected.');return}if(e.target.id==='flyer'){toast('Flyer download is coming soon.');return}if(e.target.id==='copy'){copyText(bulletin).then(()=>toast('Bulletin blurb copied.')).catch(()=>toast('Could not copy. Press and hold to copy it instead.'));return}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-kit]')){e.preventDefault();state.kit=e.target.dataset.kit;render()}});document.addEventListener('change',e=>{if(e.target.id==='monthly')state.monthly=e.target.checked;if(e.target.id==='givemonthly')state.giveMonthly=e.target.checked;if(e.target.id==='qty'){state.qty=Math.max(1,Math.min(10000,parseInt(e.target.value,10)||1));render()}if(e.target.id==='amount'){state.amount=Math.max(1,Math.min(100000,parseInt(e.target.value,10)||1));render()}});document.addEventListener('submit',e=>{if(e.target.id==='driveform'){e.preventDefault();state.thanks=true;go('drive')}});render();
</script></body></html>
