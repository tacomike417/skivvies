window.addEventListener('popstate',()=>{const was=navOpen();if(history.state&&history.state.menu){setNav(true);return}setNav(false);if(page()!==shown)render();else if(!was)window.scrollTo(0,0)});
menu.onclick=()=>{navOpen()?closeNav():openNav()};
// tapping anywhere outside the open menu closes it (the dimmed page, or the gray area around it on desktop)
document.addEventListener('click',e=>{if(navOpen()&&!e.target.closest('#nav,#menu')){e.preventDefault();e.stopImmediatePropagation();closeNav()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&navOpen()){closeNav();menu.focus()}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){if(e.metaKey||e.ctrlKey||e.shiftKey)return;e.preventDefault();go(b.dataset.go);return}
b=e.target.closest('[data-kit]');if(b){state.kit=b.dataset.kit;render();return}
b=e.target.closest('[data-qty]');if(b){state.qty=+b.dataset.qty;render();return}
b=e.target.closest('[data-customqty]');if(b){state.qty=2;render();return}
b=e.target.closest('[data-checkout]');if(b){toast('Giving opens soon. Nothing was charged.');return}
if(e.target.id==='nextslogan'){sloganIdx=(sloganIdx+1+Math.floor(Math.random()*(SLOGANS.length-1)))%SLOGANS.length;const q=document.querySelector('#slogan');q.style.opacity=0;setTimeout(()=>{q.textContent=SLOGANS[sloganIdx];q.style.opacity=1},120);return}
if(e.target.id==='doinstall'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;render()});return}
if(e.target.id==='sharebtn'){const d={title:'Skivvies',text:"Because rock bottom shouldn't be bare bottom. New underwear and socks for people starting recovery.",url:'https://skivvies.org'};if(navigator.share){navigator.share(d).catch(()=>{})}else{copyText(d.url).then(()=>toast('Link copied. Paste it anywhere.'))}return}
if(e.target.id==='copylink'){copyText('https://skivvies.org').then(()=>toast('Link copied.')).catch(()=>toast('Could not copy.'));return}
if(e.target.id==='flyer'){toast('Flyer is coming soon.');return}
if(e.target.id==='copy'){copyText(bulletin).then(()=>toast('Bulletin blurb copied.')).catch(()=>toast('Could not copy. Press and hold to copy it instead.'));return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-kit]')){e.preventDefault();state.kit=e.target.dataset.kit;render()}});
document.addEventListener('change',e=>{if(e.target.id==='monthly')state.monthly=e.target.checked;if(e.target.id==='qty'){state.qty=Math.max(1,Math.min(10000,parseInt(e.target.value,10)||1));render()}});
document.addEventListener('submit',async e=>{if(e.target.id==='reqform'){e.preventDefault();const v=id=>document.getElementById(id).value.trim();const err=document.getElementById('r_err');
 const body={place_name:v('r_place'),place_type:v('r_type'),contact_name:v('r_name'),contact:v('r_contact'),people_per_month:parseInt(v('r_per'),10)||null,who:v('r_who'),notes:v('r_notes')||null};
 if(body.place_name.length<2){err.textContent='Add the name of the place.';return}
 if(body.contact_name.length<2){err.textContent='Add your name.';return}
 if(body.contact.length<5){err.textContent='Add a phone number or email so we can reach you.';return}
 const btn=document.getElementById('r_send');btn.disabled=true;btn.textContent='Sending…';err.textContent='';
 try{await sendForm('request',body,e.target);state.reqSent=true;render()}
 catch(x){btn.disabled=false;btn.textContent='Send it →';err.textContent=x.message}
 return}
if(e.target.id==='driveform'){e.preventDefault();const f=e.target,v=n=>(f.elements[n]?.value||'').trim(),err=document.getElementById('d_err');
 const data={organization:v('organization'),contact_name:v('contact'),phone:v('phone'),email:v('email'),drive_date:v('date')||null,collecting_for:v('audience'),headcount:parseInt(v('people'),10)||null,notes:v('notes')||null};
 if(!f.reportValidity())return;
 const btn=document.getElementById('d_send');btn.disabled=true;btn.textContent='Sending…';err.textContent='';
 try{await sendForm('drive',data,f);state.thanks=true;render()}catch(x){btn.disabled=false;btn.textContent='Sign us up →';err.textContent=x.message}}});
// drag-to-scroll for the post strip (mouse on desktop; touch already scrolls)
document.addEventListener('mousedown',e=>{const st=e.target.closest('.strip');if(!st)return;e.preventDefault();let x=e.pageX,sl=st.scrollLeft,moved=false;st.classList.add('dragging');
const mv=ev=>{const dx=ev.pageX-x;if(Math.abs(dx)>3)moved=true;st.scrollLeft=sl-dx};
const up=()=>{st.classList.remove('dragging');document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)});
render();
</script>
</body>
</html>
